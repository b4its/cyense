[project]
name = "cyense"
version = "2.0.0"
description = "Cyense — Cyber Insight Engine: agentic IDOR vulnerability scanner (link & program modes)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cyense Team" }]
dependencies = [
    "fastapi>=0.110,<1.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "httpx>=0.27,<1.0",
    "uvicorn>=0.29,<1.0",
    # CLI dependencies (cli-experience.md §5.2)
    "typer>=0.12,<1.0",
    "rich>=13.7,<14.0",
    # CI/Compliance Reporting (ci-compliance-reporting.md §3.1)
    "cvss>=3.2,<4.0",
]

[project.scripts]
cyense = "app.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = ["app*", "baseline*"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
