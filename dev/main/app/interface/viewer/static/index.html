<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyense Scan Results</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Cyense Scan Results</h1>
            <div class="scan-info">
                <span class="scan-id" id="scanId">Loading...</span>
                <span class="scan-date" id="scanDate"></span>
            </div>
        </header>

        <section class="summary-section">
            <h2>Summary</h2>
            <div class="severity-grid">
                <div class="severity-card critical">
                    <div class="severity-label">Critical</div>
                    <div class="severity-count" id="criticalCount">0</div>
                </div>
                <div class="severity-card high">
                    <div class="severity-label">High</div>
                    <div class="severity-count" id="highCount">0</div>
                </div>
                <div class="severity-card medium">
                    <div class="severity-label">Medium</div>
                    <div class="severity-count" id="mediumCount">0</div>
                </div>
                <div class="severity-card low">
                    <div class="severity-label">Low</div>
                    <div class="severity-count" id="lowCount">0</div>
                </div>
                <div class="severity-card info">
                    <div class="severity-label">Info</div>
                    <div class="severity-count" id="infoCount">0</div>
                </div>
            </div>
        </section>

        <section class="findings-section">
            <h2>Findings</h2>
            <div class="filters">
                <div class="ssel-wrap" id="severityWrap">
                    <div class="ssel-trigger" id="severityTrigger" role="button" tabindex="0" aria-label="Filter severity">
                        <span id="severityCurrent">All Severities</span>
                        <svg class="ssel-arrow" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                            <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <div class="ssel-menu" id="severityMenu" role="listbox" aria-label="Filter severity">
                        <div class="ssel-search">
                            <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
                                <circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
                                <line x1="10.5" y1="10.5" x2="14" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                            <input type="search" id="severitySearch" class="ssel-search-input" placeholder="Cari severity...">
                        </div>
                        <div class="ssel-options" id="severityOptions"></div>
                        <div class="ssel-count" id="severityCount"></div>
                    </div>
                </div>
                <input type="text" id="searchInput" class="search-input" placeholder="Search findings...">
            </div>

            <div class="findings-table-container">
                <table class="findings-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Rule</th>
                            <th>Severity</th>
                            <th>CVSS</th>
                            <th>Location</th>
                            <th>Title</th>
                        </tr>
                    </thead>
                    <tbody id="findingsTableBody">
                        <tr>
                            <td colspan="6" class="loading">Loading findings...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Agent Trajectories Section (Strix-inspired agent graph visualization) -->
        <section class="trajectories-section">
            <h2>Agent Trajectories</h2>
            <p class="section-subtitle">Timeline of agent reasoning steps during the scan</p>
            <div id="trajectoriesContainer" class="trajectories-container">
                <div class="loading">Loading trajectories...</div>
            </div>
        </section>
    </div>

    <!-- Finding Detail Modal -->
    <div id="findingModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Finding Details</h2>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="static/app.js"></script>
</body>
</html>
